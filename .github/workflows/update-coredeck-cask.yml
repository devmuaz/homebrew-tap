
name: Update CoreDeck

on:
  repository_dispatch:
    types: [update-homebrew]

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Update Cask and Formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA256_DARWIN_ARM64: ${{ github.event.client_payload.sha256_darwin_arm64 }}
          SHA256_DARWIN_X86_64: ${{ github.event.client_payload.sha256_darwin_x86_64 }}
          SHA256_LINUX_ARM64: ${{ github.event.client_payload.sha256_linux_arm64 }}
          SHA256_LINUX_X86_64: ${{ github.event.client_payload.sha256_linux_x86_64 }}
        run: bash .github/scripts/update-coredeck.sh

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "coredeck: update to version ${{ github.event.client_payload.version }}"
          branch: main
