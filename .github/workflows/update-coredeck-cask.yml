name: Update CoreDeck Cask

on:
  repository_dispatch:
    types: [update-cask]

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Cask File
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          SHA256="${{ github.event.client_payload.sha256 }}"
          
          # Remove leading 'v' if present (e.g. v0.9.1 -> 0.9.1)
          CLEAN_VERSION="${VERSION#v}"

          sed -i "s/version \".*\"/version \"$CLEAN_VERSION\"/" Casks/coredeck.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/coredeck.rb

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "cask(coredeck): update to version ${{ github.event.client_payload.version }}"
          branch: main